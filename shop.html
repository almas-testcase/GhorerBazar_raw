<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F48721">
  <meta name="description" content="খাঁটিঘরের খাঁটি তেল, মধু, মশলা ও নিত্যপ্রয়োজনীয় পণ্য দেখুন।">
  <title>সব পণ্য | খাঁটিঘর</title>
  <script src="theme.js?v=21"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/brands.css" integrity="sha512-xIB3YzA/p1m4qL0nHJGvISW0uMUiAoPXWmUXiPkE83ul4+EXk7bdnIadljj4Vo3i+nCyET1e+utnbJWXjn8QNg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css?v=21">
  <link rel="stylesheet" href="pages.css?v=21">
</head>
<body data-page="shop">
  <a class="skip-link" href="#pageMain">মূল কনটেন্টে যান</a>
  <div id="siteHeader"></div>
  <main id="pageMain" class="container page-main" tabindex="-1">
    <div class="shop-head">
      <h1 id="shopTitle">সব পণ্য</h1>
      <nav class="breadcrumbs" aria-label="আপনি এখানে"><a href="index.html">হোম</a><span>›</span><span id="shopCrumb">সব পণ্য</span></nav>
    </div>
    <div class="shop-page">
      <aside class="shop-side" id="shopSide" aria-label="ফিল্টার">
        <details class="side-box" open>
          <summary>ক্যাটাগরি অনুযায়ী</summary>
          <div class="side-body" id="shopCats"></div>
        </details>
        <details class="side-box" open>
          <summary>দামের পরিসীমা</summary>
          <div class="side-body">
            <div class="price-vals"><span id="pvMin">৳ ০</span><span id="pvMax">৳ ০</span></div>
            <div class="dual-range" id="dualRange">
              <div class="dr-track"><i id="drFill"></i></div>
              <input type="range" id="rangeMin" min="0" max="100" value="0" aria-label="সর্বনিম্ন দাম">
              <input type="range" id="rangeMax" min="0" max="100" value="100" aria-label="সর্বোচ্চ দাম">
            </div>
          </div>
        </details>
        <details class="side-box" open>
          <summary>অবস্থা</summary>
          <div class="side-body">
            <label class="side-check"><input type="checkbox" id="shopStock"><span>শুধু স্টকে আছে</span></label>
            <label class="side-check"><input type="checkbox" id="shopOffer"><span>শুধু ছাড়ের পণ্য</span></label>
          </div>
        </details>
        <button type="button" class="side-reset" id="shopReset">সব ফিল্টার মুছুন</button>
      </aside>
      <section class="shop-content">
        <div class="shop-bar">
          <label class="sort-wrap"><b>সাজান:</b>
            <select id="shopSort" aria-label="পণ্যের ক্রম"><option value="">ডিফল্ট</option><option value="low">দাম: কম থেকে বেশি</option><option value="high">দাম: বেশি থেকে কম</option><option value="disc">সবচেয়ে বেশি ছাড়</option><option value="name">নাম অনুযায়ী</option></select>
          </label>
          <p id="shopStatus" class="page-status" role="status" aria-live="polite"></p>
        </div>
        <div id="shopProducts" class="products page-products" aria-busy="true"><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div><div class="product sk"><div class="sk-img"></div><div class="sk-body"><i></i><i class="s"></i><i class="b"></i></div></div></div>
      </section>
    </div>
  </main>
  <div id="siteFooter"></div>
  <div id="pageToast" class="toast" role="status"></div>
  <script src="config.js?v=21"></script>
  <script src="pages.js?v=21"></script>
</body>
</html>
